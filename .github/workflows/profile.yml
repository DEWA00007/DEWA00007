name: Update GitHub Profile

on:
  schedule:
    # Runs every day at 00:17 UTC
    - cron: "17 0 * * *"

  # Allows you to update it manually
  workflow_dispatch:

  # Also updates whenever this workflow is changed
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  update-profile:

    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────
      # CHECKOUT
      # ─────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # GITHUB STATS
      # ─────────────────────────────────────

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=DEWA00007
            &show_icons=true
            &include_all_commits=true
            &hide_border=true
            &theme=transparent
            &rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────
      # TOP LANGUAGES
      # ─────────────────────────────────────

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=DEWA00007
            &layout=compact
            &langs_count=8
            &hide_border=true
            &theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────
      # STREAK
      # ─────────────────────────────────────

      - name: Generate streak
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: streak
          options: >-
            user=DEWA00007
            &hide_border=true
            &theme=transparent
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────
      # CONTRIBUTION SNAKE
      # ─────────────────────────────────────

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DEWA00007
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            profile/github-snake.svg?palette=github-light
            profile/github-snake-dark.svg?palette=github-dark

      # ─────────────────────────────────────
      # SAVE GENERATED FILES
      # ─────────────────────────────────────

      - name: Commit generated profile assets
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update GitHub profile"

          git push
